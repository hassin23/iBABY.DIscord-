<!DOCTYPE html>
<html>
<head>
  <title>Hassin</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
    }

    .card{
      background:#181818;
      padding:40px;
      border-radius:25px;
      text-align:center;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    img{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
    }

    h1{
      margin-top:15px;
    }

    p{
      color:#aaa;
    }

    a{
      display:block;
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:#242424;
      color:white;
      text-decoration:none;
      transition:0.2s;
    }

    a:hover{
      background:#333;
    }
  </style>
</head>

<body>

<div class="card">

  <img src="https://i.imgur.com/yourimage.jpg">

  <h1>Hassin</h1>

  <p>Content Creator</p>

  <a href="#">YouTube</a>
  <a href="#">Discord</a>
  <a href="#">TikTok</a>

</div>

</body>
</html>
